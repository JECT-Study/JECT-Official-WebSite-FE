name: API Spec Drift

# 백엔드 스펙이 바뀌었는데 저장소의 스냅샷에 반영되지 않은 상태를 찾는다.
on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch spec
        run: pnpm gen:api:fetch

      - name: Compare with snapshot
        run: |
          if ! git diff --exit-code -- packages/api-types/specs; then
            echo "::error::백엔드 스펙이 변경되었습니다. pnpm gen:api:fetch && pnpm gen:api 후 커밋하세요."
            exit 1
          fi

      - name: Generate error codes
        run: pnpm gen:errors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare error codes
        run: |
          if ! git diff --exit-code -- packages/api-types/src/errors.ts; then
            echo "::error::백엔드 에러 코드가 변경되었습니다. pnpm gen:errors 후 커밋하세요."
            exit 1
          fi
